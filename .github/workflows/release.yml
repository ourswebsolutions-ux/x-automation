# Builds X Auto natively on Linux, Windows and macOS and publishes the installers to a GitHub Release.
#
#   • Pushing a tag vX.Y.Z (npm run release -- X.Y.Z does this) → test + build on all three → one Release.
#   • A push to main that changes the build setup → test + build only (artifacts, no Release).
#   • Run manually (Actions → Release → Run workflow):
#       - tag empty      → test + build only; installers are kept as workflow artifacts, no Release.
#       - tag "v1.2.3"   → (re)build that existing tag and create/update its Release (safe to rerun).
#
# No secrets are needed for unsigned builds. Optional signing secrets are described in docs/release.md.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - electron-builder.yml
      - package.json
      - package-lock.json
      - scripts/prepare-engine.mjs
      - engine/requirements.lock
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.0.0). Leave empty to build without releasing.'
        required: false
        default: ''

# Least privilege: read-only by default; only the release job may write (contents: write).
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            platform: linux
            prepare: --platform=linux
            builder: --linux --x64
          - name: Windows x64
            os: windows-latest
            platform: win
            prepare: --platform=win
            builder: --win --x64
          - name: macOS arm64
            os: macos-latest
            platform: mac
            prepare: --platform=mac --arch=arm64
            builder: --mac --arm64
    steps:
      - name: Check out ${{ env.TAG || github.ref_name }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Host Python is used only at build time to install the hash-locked engine wheels.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches package.json
        if: env.TAG != ''
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Prepare the bundled Python + Playwright engine runtime
        run: node scripts/prepare-engine.mjs ${{ matrix.prepare }}

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Engine tests (bundled Python, real Chrome when available)
        run: npm run engine:test

      - name: Build the app
        run: npx electron-vite build

      - name: Package installers
        shell: bash
        env:
          # Unsigned unless the optional secrets exist (see docs/release.md). Nothing is hardcoded.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          # Empty variables would look "set" to electron-builder; drop them.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          npx electron-builder ${{ matrix.builder }} --publish never

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p dist-upload
          find release -maxdepth 2 -type f \( -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' -o -name '*.zip' \) -exec cp {} dist-upload/ \;
          ls -la dist-upload
          count=$(find dist-upload -type f | wc -l)
          if [ "$count" -eq 0 ]; then echo "::error::No installers were produced"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: x-auto-${{ matrix.platform }}
          path: dist-upload/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    # Only for a tag, and only when every platform built (needs: build fails otherwise).
    if: needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: x-auto-*
          path: dist
          merge-multiple: true

      - name: Expect every platform's installers
        shell: bash
        run: |
          ls -la dist
          for pattern in '*.AppImage' '*.deb' '*.exe' '*.dmg' '*.zip'; do
            if ! compgen -G "dist/$pattern" > /dev/null; then echo "::error::Missing $pattern"; exit 1; fi
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Write release notes
        run: node scripts/release-notes.mjs "$TAG" dist > release-notes.md && cat release-notes.md

      - name: Create or update the release and upload assets (rerun-safe)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists — updating notes and replacing assets"
            gh release edit "$TAG" --title "X Auto $TAG" --notes-file release-notes.md
          else
            # Created as a draft first, so a half-uploaded release is never visible as published.
            gh release create "$TAG" --verify-tag --draft --title "X Auto $TAG" --notes-file release-notes.md
          fi
          # --clobber replaces same-named assets, so reruns never duplicate files.
          gh release upload "$TAG" dist/* --clobber
          prerelease=false
          case "$TAG" in *-*) prerelease=true ;; esac
          gh release edit "$TAG" --draft=false --prerelease=$prerelease
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | "  \(.name)  \(.size) bytes")'
