# X Auto release pipeline: native builds on Linux, Windows and macOS (Intel + Apple silicon),
# then ONE GitHub Release with every installer and the auto-update metadata.
#
#   • Push of a tag vX.Y.Z / vX.Y.Z-beta.N (done by `npm run release -- X.Y.Z`) → build, validate, publish.
#   • Actions → Release → Run workflow:
#       - tag empty     → build + validate only (artifacts, no release).
#       - tag "vX.Y.Z"  → rebuild that existing tag and create/repair its release (rerun-safe).
#   • A push to main that changes the build setup → build + validate only.
#
# The release is created as a draft, every file is uploaded and verified, and only then is it
# published — so a partial release is never visible to users or to the auto-updater.
# Unsigned by default; optional signing secrets are described in docs/release.md.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - electron-builder.yml
      - package.json
      - package-lock.json
      - scripts/prepare-engine.mjs
      - scripts/release-assets.mjs
      - engine/requirements.lock
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release, e.g. v1.0.1. Leave empty to build without releasing.'
        required: false
        default: ''

# Least privilege: read-only by default; only the publish job gets contents: write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Linux x64
            id: linux-x64
            os: ubuntu-22.04
            platform: linux
            prepare: --platform=linux
            builder: --linux --x64
          - name: Windows x64
            id: windows-x64
            os: windows-latest
            platform: win
            prepare: --platform=win
            builder: --win --x64
          - name: macOS arm64
            id: macos-arm64
            os: macos-latest
            platform: mac
            arch: arm64
            prepare: --platform=mac --arch=arm64
            builder: --mac --arm64
          - name: macOS x64
            id: macos-x64
            os: macos-15-intel
            platform: mac
            arch: x64
            prepare: --platform=mac --arch=x64
            builder: --mac --x64
    steps:
      - name: Check out ${{ env.TAG || github.ref_name }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Host Python is used only at build time to install the hash-locked engine wheels.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Check the version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ] && [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Prepare the bundled Python + Playwright engine runtime
        run: node scripts/prepare-engine.mjs ${{ matrix.prepare }}

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Release tooling tests
        if: matrix.platform == 'linux'
        run: npm run test:release

      - name: Engine tests (bundled Python, real Chrome)
        run: npm run engine:test

      - name: Build the app
        run: npx electron-vite build

      - name: Package installers
        shell: bash
        env:
          # Unsigned unless the optional secrets exist (docs/release.md). Nothing is hardcoded.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          # Empty variables would look "set" to electron-builder; drop them.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          npx electron-builder ${{ matrix.builder }} --publish never

      - name: Collect installers and update metadata
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          out="release/$VERSION"
          # Each mac runner must build only its own architecture (its bundled Python runtime is arch-specific).
          if [ "$PLATFORM" = "mac" ]; then
            other=$([ "$ARCH" = "arm64" ] && echo x64 || echo arm64)
            if find "$out" -maxdepth 1 -name "X-Auto-*-macos-$other.*" | grep -q .; then
              echo "::error::The $ARCH runner also produced $other files — check the mac targets in electron-builder.yml"
              exit 1
            fi
          fi
          mkdir -p dist-upload
          find "$out" -maxdepth 1 -type f \( -name 'X-Auto-*' -o -name '*.yml' \) ! -name 'builder-*' -exec cp {} dist-upload/ \;
          # Each mac runner writes <channel>-mac.yml for its own arch; keep both (merged when publishing).
          if [ "$PLATFORM" = "mac" ]; then
            for f in dist-upload/*-mac.yml; do mv "$f" "${f%.yml}-$ARCH.yml"; done
          fi
          ls -la dist-upload
          if ! find dist-upload -name 'X-Auto-*' -type f | grep -q .; then echo "::error::No installers were produced"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: x-auto-${{ matrix.id }}
          path: dist-upload/*
          if-no-files-found: error
          retention-days: 14

  validate:
    name: Validate the complete set
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install script dependencies
        run: npm ci --ignore-scripts
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # One folder per build (no merge-multiple): same-named files from two builds must not overwrite
      # each other silently — the collect step refuses any collision.
      - uses: actions/download-artifact@v4
        with:
          pattern: x-auto-*
          path: dist-parts
      - name: Combine the builds (fails on duplicate file names)
        run: node scripts/release-assets.mjs collect dist-parts dist
      - name: Merge mac metadata from the final files, validate every installer and the update metadata
        run: node scripts/release-assets.mjs prepare "${{ steps.version.outputs.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: validate
    # Only for a release tag, and only after every platform built and the full set validated.
    if: needs.validate.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install script dependencies
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - name: Write release notes
        run: node scripts/release-notes.mjs "$TAG" dist > release-notes.md && cat release-notes.md

      - name: Create (draft) or update the release and upload every file
        shell: bash
        run: |
          pre=false
          case "$VERSION" in *-*) pre=true ;; esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists — updating notes and replacing assets (no duplicates)"
            gh release edit "$TAG" --title "X Auto $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --verify-tag --draft --title "X Auto $TAG" --notes-file release-notes.md $([ "$pre" = true ] && echo --prerelease)
          fi
          # --clobber replaces same-named assets, so reruns never duplicate files.
          gh release upload "$TAG" dist/* --clobber

      - name: Publish (stable releases become "latest"; pre-releases never do)
        shell: bash
        run: |
          case "$VERSION" in
            *-*) gh release edit "$TAG" --draft=false --prerelease --latest=false ;;
            *)   gh release edit "$TAG" --draft=false --prerelease=false --latest ;;
          esac

      - name: Verify the published release (assets, downloads, update metadata)
        run: node scripts/release-assets.mjs verify-remote "$VERSION" "${{ github.repository }}" dist
